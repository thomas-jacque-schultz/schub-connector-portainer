spring:
  config:
    import: "optional:configtree:/run/secrets/"
  application:
    name: connector.portainer

server:
  port: 8080

schub:
  internal-secret: ${SCHUB_INTERNAL_SECRET:change-me-internal-secret}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

portainer:
  base-url: ${PORTAINER_VIRTUAL_HOST:http://admin-portainer:9000}
  token: ${PORTAINER_TOKEN:}
  endpoint-id: ${PORTAINER_ENDPOINT_ID:2}
  refresh-interval: ${PORTAINER_REFRESH_INTERVAL:60s}
  stale-after: ${PORTAINER_STALE_AFTER:5m}
  connect-timeout: 3s
  read-timeout: 10s
